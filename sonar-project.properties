sonar.projectKey = common-portal
sonar.projectName = Common Portal

# Typescript tests files must be inside sources and tests, otherwise `INFO: Test execution data ignored for 80 unknown
# files, including:` is shown.
sonar.sources = src
sonar.tests = src
sonar.host.url = http://localhost:9001
sonar.sourceEncoding = UTF-8

sonar.test.inclusions = src/test/**/*.*, src/app/**/*.spec.ts, src/app/**/*.spec.tsx
sonar.exclusions = src/content/**/*.*, src/i18n/*.ts, target/classes/static/**/*.*
sonar.javascript.lcov.reportPaths = target/test-results/lcov-report/lcov.info
sonar.testExecutionReportPaths = target/test-results/TESTS-results-vitest.xml

sonar.issue.ignore.multicriteria =
